<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Academy | SSLC A+ Poster Generator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; box-sizing: border-box;}
        
        h2 { color: #003b8e; text-align: center; margin: 15px 0 25px 0; font-size: 1.5rem; }
        
        /* Mobile-First Layout: Stack controls above the canvas */
        .main-generator-box { display: flex; flex-direction: column-reverse; gap: 20px; align-items: center; max-width: 1200px; width: 100%; }
        
        .canvas-display { width: 100%; max-width: 450px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 8px solid white; box-sizing: border-box; background: white; margin-bottom: 20px;}
        canvas { width: 100%; height: auto; display: block; }

        .controls-panel { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; border-top: 5px solid #003b8e; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.95rem; font-weight: 700; color: #333; margin-bottom: 8px; }
        
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        
        /* Adjustment Sliders (Mobile Optimized) */
        .sliders-group { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .sliders-group label { color: #666; font-weight: 600; font-size: 0.85rem; }
        
        /* Custom range styling for mobile touch */
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; outline: none; margin: 8px 0 20px 0; cursor: pointer;}
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; background: #003b8e; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; background: #003b8e; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.1); }
        
        .btn-download { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 6px 12px rgba(16, 185, 129, 0.2); display: flex; align-items: center; justify-content: center; gap: 10px;}
        .btn-download:hover { background: #059669; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25); }

        /* Tablet/Desktop: Show side-by-side */
        @media (min-width: 768px) {
            h2 { font-size: 2rem; }
            .main-generator-box { flex-direction: row; align-items: flex-start; justify-content: center; }
            .canvas-display { margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <h2><i class="fas fa-certificate" style="color: #f59e0b;"></i> SSLC 2026 Full A+ Poster</h2>

    <div class="main-generator-box">
        <!-- 1. CANVAS (Preview Panel - Shows up first in mobile order) -->
        <div class="canvas-display">
            <!-- Fixed vertical dimension 1080x1920 (9:16 ratio) based on perfect image_3.png layout -->
            <canvas id="posterCanvas" width="1080" height="1920"></canvas>
        </div>

        <!-- 2. CONTROLS (Input Panel) -->
        <div class="controls-panel">
            <div class="form-group">
                <label>1. Student's Full Name</label>
                <!-- FIXED: changed 'e.g. Noushin Rahman' to 'Name' -->
                <input type="text" id="studentName" placeholder="Name" onkeyup="drawPosterOnCanvas()">
            </div>
            
            <div class="form-group">
                <label>2. Upload Portrait (Clear, Centered)</label>
                <input type="file" id="studentPhoto" accept="image/*" onchange="loadStudentPhoto(event)">
            </div>

            <div class="sliders-group">
                <label><i class="fas fa-search-plus"></i> Size (Zoom)</label>
                <input type="range" id="zoomFactor" min="0.5" max="4" step="0.05" value="1" oninput="drawPosterOnCanvas()">
                
                <label><i class="fas fa-arrows-alt-h"></i> Horizontal Position</label>
                <input type="range" id="posXOffset" min="-1200" max="1200" value="0" oninput="drawPosterOnCanvas()">
                
                <label><i class="fas fa-arrows-alt-v"></i> Vertical Position</label>
                <input type="range" id="posYOffset" min="-1200" max="1200" value="0" oninput="drawPosterOnCanvas()">
            </div>
            
            <button class="btn-download" onclick="triggerDownloadPoster()"><i class="fas fa-cloud-download-alt"></i> Download PNG</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        
        const templateImgAsset = new Image();
        const studentImgAsset = new Image();
        
        // This must match your transparent template on GitHub
        templateImgAsset.src = 'sslc-template.png'; 
        
        templateImgAsset.onload = drawPosterOnCanvas;

        function loadStudentPhoto(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                studentImgAsset.src = e.target.result;
                studentImgAsset.onload = drawPosterOnCanvas;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function drawPosterOnCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // A. Draw STUDENT PHOTO first
            if (studentImgAsset.src) {
                const currentZoom = parseFloat(document.getElementById('zoomFactor').value);
                const currentXOffset = parseInt(document.getElementById('posXOffset').value);
                const currentYOffset = parseInt(document.getElementById('posYOffset').value);

                const finalImgWidth = studentImgAsset.width * currentZoom;
                const finalImgHeight = studentImgAsset.height * currentZoom;
                
                // Position generally behind the transparent circle hole area
                const startXPos = (canvas.width - finalImgWidth) / 2 + currentXOffset;
                const startYPos = (canvas.height - finalImgHeight) / 2 - 100 + currentYOffset; 

                ctx.drawImage(studentImgAsset, startXPos, startYPos, finalImgWidth, finalImgHeight);
            }

            // B. Draw Transparent Template ON TOP
            ctx.drawImage(templateImgAsset, 0, 0, canvas.width, canvas.height);

            // C. Add the Student's Name
            const studentNameValue = document.getElementById('studentName').value;
            if (studentNameValue) {
                ctx.font = "900 85px 'Poppins', sans-serif";
                ctx.fillStyle = "#003b8e"; // Bold Dark Blue to match the theme
                ctx.textAlign = "center";
                
                // Positioned below the circle, in the large white gap.
                // FIXED: Changed from 1530 to 1300 to move it significantly UP from the footer, correcting image_5.png.
                ctx.fillText(studentNameValue.toUpperCase(), canvas.width / 2, 1400); 
            }
        }

        function triggerDownloadPoster() {
            const nameToUse = document.getElementById('studentName').value || 'Student';
            const sanitizedName = nameToUse.replace(/\s+/g, '_');
            const fileName = sanitizedName + '_SSLC_2026.png';

            // iOS Native Share Menu Trick
            if (navigator.canShare && navigator.share) {
                canvas.toBlob(function(blob) {
                    const file = new File([blob], fileName, { type: "image/png" });
                    
                    // If the phone supports sharing files directly (iPhones do this well)
                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: nameToUse + ' A+ Poster'
                        }).catch((error) => console.log('User closed share menu', error));
                    } else {
                        // Fallback
                        forceStandardDownload(fileName); 
                    }
                });
            } else {
                // Fallback for PC and older Androids
                forceStandardDownload(fileName); 
            }
        }

        // The original standard download method (kept here as a backup)
        function forceStandardDownload(fileName) {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
